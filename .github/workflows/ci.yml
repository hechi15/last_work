# 코드를 올릴 때마다 GitHub가 자동으로 하는 검사 순서를 적은 설명서
name: 자동 검사

# 언제 실행할지: main에 코드가 올라갈 때, PR이 만들어지거나 고쳐질 때
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # GitHub가 빌려주는 깨끗한 리눅스 컴퓨터에서 실행한다
    runs-on: ubuntu-latest
    steps:
      - name: 프로젝트 내려받기
        uses: actions/checkout@v7

      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 필요한 도구 설치
        run: npm ci

      - name: 테스트 실행
        run: npm test

      - name: 빌드 실행
        run: npm run build